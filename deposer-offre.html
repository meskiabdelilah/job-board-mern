<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Déposer une offre - JobBoard MERN</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="container nav-flex">
            <a href="index.html" class="logo">JobBoard <span>MERN</span></a>
            <nav>
                <a href="index.html" class="nav-link">Offres</a>
                <a href="offres-suivies.html" class="nav-link">Offres suivies</a>
                <a href="deposer-offre.html" class="btn btn-primary">+ Déposer</a>
            </nav>
        </div>
    </header>

    <!-- FORM SECTION -->
    <main class="container-sm page-main">
        <a href="index.html" class="back-link">← Annuler et retourner</a>

        <div class="job-card job-card-lg">
            <h2>Déposer une nouvelle offre</h2>
            <p class="company">Remplissez le formulaire ci-dessous pour publier votre opportunité.</p>

            <hr class="divider">

            <form id="add-job-form">
                <div class="form-group">
                    <label for="title">Titre de l'offre *</label>
                    <input type="text" id="title" class="form-control" placeholder="Ex: Développeur Fullstack React / Node.js" required>
                </div>

                <div class="form-group">
                    <label for="company">Nom de l'entreprise *</label>
                    <input type="text" id="company" class="form-control" placeholder="Ex: TechCorp" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="city">Ville *</label>
                        <select id="city" class="form-control" required>
                            <option value="">Sélectionner une ville</option>
                            <option value="Casablanca">Casablanca</option>
                            <option value="Rabat">Rabat</option>
                            <option value="A distance">A distance (Remote)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="type">Type de contrat *</label>
                        <select id="type" class="form-control" required>
                            <option value="">Sélectionner le type</option>
                            <option value="Stage">Stage</option>
                            <option value="Alternance">Alternance</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="technologies">Technologies (séparées par des virgules) *</label>
                    <input type="text" id="technologies" class="form-control" placeholder="Ex: React, Node.js, Express, MongoDB" required>
                </div>

                <div class="form-group">
                    <label for="description">Description de l'offre *</label>
                    <textarea id="description" class="form-control" rows="5" placeholder="Détaillez les missions, le profil recherché..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="contactEmail">Email de contact pour postuler *</label>
                    <input type="email" id="contactEmail" class="form-control" placeholder="Ex: recrutement@techcorp.ma" required>
                </div>

                <button type="submit" class="btn btn-primary btn-full btn-lg">Publier l'offre</button>
            </form>
        </div>
    </main>

</body>
</html>
